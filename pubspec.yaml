name: dokkanaproject
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  google_fonts: ^7.0.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  glaze_nav_bar: ^1.2.1
  shared_preferences: ^2.5.4
  image_picker: ^1.2.1
  get: ^4.7.3
  google_maps_flutter: ^2.14.0
  google_maps_flutter_android: ^2.18.9
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  provider: ^6.1.5+1
  pinput: ^6.0.1
  device_preview: ^1.3.1
  flutter_bloc: ^9.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Images/
    - assets/svgs/
    - assets/Icons/LuncherIcon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/Icons/LuncherIcon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/Icons/LuncherIcon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  windows:
    generate: true
    image_path: "path/to/image.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/Icons/LuncherIcon.png"
    dependencies:
      image_picker: ^1.0.7
      shared_preferences: ^2.2.2
